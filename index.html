<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yol Arkadaşı - Prototip</title>
  <style>
    body { margin:0; background:#000; color:#fff; font-family:sans-serif; text-align:center; }
    video { width:100%; max-height:70vh; object-fit:cover; background:#222; }
    button { font-size:28px; padding:24px; width:90%; margin:16px 0;
             border-radius:16px; border:none; background:#ffd400; color:#000; font-weight:bold; }
    #durum { font-size:20px; padding:8px; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <div id="durum" role="status" aria-live="polite">Kamera kapalı.</div>
  <button id="baslat" aria-label="Kamerayı başlat">KAMERAYI BAŞLAT</button>

  <script>
    const video = document.getElementById('video');
    const durum = document.getElementById('durum');
    const btn = document.getElementById('baslat');

    btn.addEventListener('click', async () => {
      try {
        const akis = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = akis;
        durum.textContent = 'Kamera açık.';
        btn.style.display = 'none';
      } catch (hata) {
        durum.textContent = 'Kamera açılamadı: ' + hata.message;
      }
    });
  </script>
</body>
</html>
