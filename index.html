<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yol Arkadaşı - Prototip</title>
  <style>
    body { margin:0; background:#000; color:#fff; font-family:system-ui, sans-serif; }
    #sahne { position:relative; width:100%; }
    video { width:100%; display:block; background:#222; }
    canvas { position:absolute; left:0; top:0; width:100%; height:100%; }
    #liste { font-size:22px; padding:12px 16px; min-height:110px; text-align:left;
             line-height:1.45; white-space:pre-line; }
    button { font-size:28px; padding:24px; width:90%; margin:16px 5%;
             border-radius:16px; border:none; background:#ffd400; color:#000; font-weight:bold; }
    button:focus-visible { outline:4px solid #fff; }
    details { text-align:left; padding:8px 16px 28px; font-size:18px; color:#ddd; }
    input[type=range] { width:100%; margin-top:12px; }
    #sonSoz { font-size:18px; color:#ffd400; padding:4px 16px; min-height:26px; text-align:left; }
    #sesBtn { background:#fff; }
  </style>
</head>
<body>
  <div id="sahne">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="kanvas"></canvas>
  </div>
  <div id="liste" aria-live="off">Kamera kapalı.</div>
  <div id="sonSoz" aria-live="off"></div>
  <button id="baslat" aria-label="Başlat">BAŞLAT</button>
  <button id="sesBtn" aria-label="Sesi kapat">SES: AÇIK</button>

  <details>
    <summary>Ayarlar (test için)</summary>
    <label for="duzeltme">Mesafe düzeltmesi: <span id="duzeltmeDeger">1,00</span> katı</label>
    <input type="range" id="duzeltme" min="0.5" max="1.5" step="0.05" value="1">
  </details>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

  <script>
    // ---------- AYARLAR ----------
    // Kameranın uzun kenar boyunca görüş açısı (derece). iPhone 11 ana kamera için kaba değer.
    const GORUS_ACISI = 63;
    const MAX_MESAFE = 15;      // bu mesafeden uzağı "uzak" say
    const ON_ESIK_ACI = 10;     // bu açının içi "önünüzde"

    // Nesnelerin yaklaşık gerçek boyu (metre). Mesafe hesabı buna dayanır.
    const GERCEK_BOY = {
      'person':1.7, 'bicycle':1.0, 'car':1.5, 'motorcycle':1.2, 'bus':3.2, 'truck':3.0,
      'bench':0.85, 'chair':0.9, 'couch':0.85, 'dog':0.5, 'fire hydrant':0.75,
      'dining table':0.75, 'bottle':0.22
    };

    const TR = {
      'person':'insan', 'bicycle':'bisiklet', 'car':'araba', 'motorcycle':'motosiklet',
      'bus':'otobüs', 'truck':'kamyon', 'traffic light':'trafik ışığı', 'stop sign':'dur tabelası',
      'fire hydrant':'yangın musluğu', 'parking meter':'park sayacı', 'bench':'bank',
      'dog':'köpek', 'cat':'kedi', 'chair':'sandalye', 'couch':'koltuk', 'potted plant':'saksı bitkisi',
      'bed':'yatak', 'dining table':'masa', 'tv':'televizyon', 'laptop':'dizüstü bilgisayar',
      'cell phone':'telefon', 'bottle':'şişe', 'cup':'bardak', 'backpack':'sırt çantası',
      'umbrella':'şemsiye', 'handbag':'çanta', 'suitcase':'bavul', 'book':'kitap'
    };

    // ---------- DEĞİŞKENLER ----------
    const video = document.getElementById('video');
    const kanvas = document.getElementById('kanvas');
    const ctx = kanvas.getContext('2d');
    const liste = document.getElementById('liste');
    const btn = document.getElementById('baslat');
    const kaydirici = document.getElementById('duzeltme');
    const duzeltmeDeger = document.getElementById('duzeltmeDeger');

    let model = null;
    let calisiyor = false;
    let odak = 500;      // odak uzaklığı (piksel), görüntü boyutuna göre hesaplanır
    let duzeltme = 1;    // mesafe düzeltme çarpanı

    try {
      const k = parseFloat(localStorage.getItem('duzeltme'));
      if (k >= 0.5 && k <= 1.5) duzeltme = k;
    } catch (e) {}
    kaydirici.value = duzeltme;
    duzeltmeDeger.textContent = duzeltme.toFixed(2).replace('.', ',');

    kaydirici.addEventListener('input', () => {
      duzeltme = parseFloat(kaydirici.value);
      duzeltmeDeger.textContent = duzeltme.toFixed(2).replace('.', ',');
      try { localStorage.setItem('duzeltme', duzeltme); } catch (e) {}
    });

    // Bir işlem belirtilen saniyede bitmezse hata verir (sonsuza kadar takılmasın diye)
    function zamanAsimi(islem, sn, ad) {
      return Promise.race([
        islem,
        new Promise((_, red) => setTimeout(
          () => red(new Error(ad + ' ' + sn + ' saniyede bitmedi')), sn * 1000))
      ]);
    }

    // ---------- SESLİ UYARI ----------
    const SES_MAX = 5;        // bu mesafeden (m) uzaktakileri söyleme
    const TEKRAR_SN = 6;      // aynı uyarıyı en az kaç saniyede bir söyle
    const ARA_SN = 1.5;       // iki konuşma arası en az süre (acil durum hariç)
    const KARARLI_KARE = 2;   // nesne en az kaç ardışık karede görülmeli (titremeyi eler)
    // Tehlike ağırlığı: mesafe bu sayıya bölünür, yani araç 6 m'de bile "yakın" sayılır
    const AGIRLIK = { car:2, bus:2, truck:2, motorcycle:2, bicycle:1.5, person:1.2, dog:1.2 };
    const ARAC = ['car', 'bus', 'truck', 'motorcycle'];

    const sonSozEl = document.getElementById('sonSoz');
    const sesBtn = document.getElementById('sesBtn');
    let sesAcik = true, trSes = null, sonKonusma = 0, gorulme = {};
    const sonSoylenen = {};

    function sesSec() {
      if (!('speechSynthesis' in window)) return;
      const sesler = speechSynthesis.getVoices();
      trSes = sesler.find(v => v.lang && v.lang.replace('_', '-').toLowerCase().startsWith('tr')) || null;
    }
    sesSec();
    if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = sesSec;

    sesBtn.addEventListener('click', () => {
      sesAcik = !sesAcik;
      sesBtn.textContent = sesAcik ? 'SES: AÇIK' : 'SES: KAPALI';
      sesBtn.setAttribute('aria-label', sesAcik ? 'Sesi kapat' : 'Sesi aç');
      if (!sesAcik && 'speechSynthesis' in window) speechSynthesis.cancel();
    });

    // Metni sesli okur. Konuşma sürerken yeni uyarı ancak "acil" ise öncekini keser.
    function konus(metin, acil) {
      if (!sesAcik || !('speechSynthesis' in window)) return false;
      if (speechSynthesis.speaking) {
        if (!acil) return false;
        speechSynthesis.cancel();
      }
      const u = new SpeechSynthesisUtterance(metin);
      u.lang = 'tr-TR';
      if (trSes) u.voice = trSes;
      speechSynthesis.speak(u);
      return true;
    }

    function mesafeSoz(m) {
      const tam = Math.floor(m);
      const buc = (m - tam) >= 0.5;
      if (tam === 0) return 'yarım metre';
      return tam + (buc ? ' buçuk' : '') + ' metre';
    }

    function sesliUyari(nesneler) {
      const simdi = Date.now();
      const yeni = {};
      let secilen = null, secAnahtar = '', secSayi = 0, secEtkin = Infinity;

      for (const n of nesneler) {
        const sayi = n.yakin ? 0 : n.mesafe;
        if (sayi === null || sayi > SES_MAX) continue;   // mesafesi bilinmeyeni veya uzağı söyleme

        const anahtar = n.sinif + '|' + n.yon;            // örn. "person|önünüzde"
        if (!(anahtar in yeni)) yeni[anahtar] = (gorulme[anahtar] || 0) + 1;
        if (yeni[anahtar] < KARARLI_KARE) continue;       // henüz yeterince kararlı değil

        const son = sonSoylenen[anahtar];
        const gecen = son ? simdi - son.zaman : Infinity;
        // Tekrar söyleme: süre dolduysa VEYA nesne en az 1 m yaklaştıysa
        const yeniden = gecen > TEKRAR_SN * 1000 || (gecen > 2000 && sayi <= son.mesafe - 1);
        if (!yeniden) continue;

        const etkin = sayi / (AGIRLIK[n.sinif] || 1);
        if (etkin < secEtkin) { secEtkin = etkin; secilen = n; secAnahtar = anahtar; secSayi = sayi; }
      }
      gorulme = yeni;
      if (!secilen) return;

      const acil = secilen.yakin || secSayi <= 1.5 || (ARAC.includes(secilen.sinif) && secSayi <= 4);
      if (!acil && simdi - sonKonusma < ARA_SN * 1000) return;

      const metin = secilen.yakin
        ? 'Dikkat, çok yakın, ' + secilen.yon + ' ' + secilen.isim + ' var.'
        : mesafeSoz(secSayi) + ' ' + secilen.yon + ' ' + secilen.isim + ' var.';

      if (konus(metin, acil)) {
        sonSoylenen[secAnahtar] = { zaman: simdi, mesafe: secSayi };
        sonKonusma = simdi;
        sonSozEl.textContent = 'Son söylenen: ' + metin;
      }
    }

    // ---------- BAŞLAT ----------
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      konus('Başlatılıyor.', true);   // iPhone sesi ancak dokunuş sırasında açar, o yüzden en başta
      try {
        liste.textContent = 'Kamera açılıyor...';
        const akis = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = akis;
        await video.play();

        const t0 = Date.now();
        let adim = 'Adım 1/3: Yapay zeka motoru hazırlanıyor';
        const sayac = setInterval(() => {
          liste.textContent = adim + ' (' + Math.round((Date.now() - t0) / 1000) + ' sn)';
        }, 500);
        try {
          await zamanAsimi(tf.ready(), 20, 'Motor hazırlığı');
          adim = 'Adım 2/3: Motor: ' + tf.getBackend() + '. Model indiriliyor';
          model = await zamanAsimi(cocoSsd.load({ base: 'lite_mobilenet_v2' }), 60, 'Model indirme');
        } catch (e1) {
          if (tf.getBackend() === 'cpu') throw e1;
          adim = 'Adım 3/3: Yedek motorla (cpu) tekrar deneniyor. İlk hata: ' + e1.message;
          await tf.setBackend('cpu');
          await tf.ready();
          model = await zamanAsimi(cocoSsd.load({ base: 'lite_mobilenet_v2' }), 90, 'Model indirme (cpu)');
        } finally {
          clearInterval(sayac);
        }

        btn.style.display = 'none';
        calisiyor = true;
        konus('Yol arkadaşı hazır. Bu sistem bastonun yerini tutmaz.', true);
        dongu();
      } catch (hata) {
        liste.textContent = 'Hata: ' + hata.message;
        btn.disabled = false;
      }
    });

    // Saniyede yaklaşık 5 kez analiz (pil ve ısınma için)
    async function dongu() {
      if (!calisiyor) return;
      if (video.readyState >= 2) {
        if (kanvas.width !== video.videoWidth || kanvas.height !== video.videoHeight) {
          kanvas.width = video.videoWidth;
          kanvas.height = video.videoHeight;
          // Odak uzaklığı (piksel) = (uzun kenar / 2) / tan(görüş açısı / 2)
          odak = (Math.max(kanvas.width, kanvas.height) / 2) /
                 Math.tan((GORUS_ACISI * Math.PI / 180) / 2);
        }
        const sonuclar = await model.detect(video);
        isle(sonuclar);
      }
      setTimeout(dongu, 200);
    }

    // ---------- YÖN VE MESAFE ----------
    function analizEt(s) {
      const [x, y, g, h] = s.bbox;
      const vw = kanvas.width, vh = kanvas.height;

      // Yön: kutunun yatay merkezinin kamera ekseninden kaç derece saptığı (+ sağ, - sol)
      const merkez = x + g / 2;
      const aci = Math.atan((merkez - vw / 2) / odak) * 180 / Math.PI;
      const yon = aci > ON_ESIK_ACI ? 'sağınızda' : aci < -ON_ESIK_ACI ? 'solunuzda' : 'önünüzde';
      const saat = ((12 + Math.round(aci / 30) - 1 + 12) % 12) + 1;

      // Mesafe: nesne boyundan (kutu yüksekliği ne kadar küçükse o kadar uzak)
      let mesafe = null, yakin = false;
      const boy = GERCEK_BOY[s.class];
      if (boy) {
        if (y <= 3 || y + h >= vh - 3) {
          yakin = true; // nesne kadraja sığmıyor: tahmin güvenilmez, "çok yakın" say
        } else {
          mesafe = Math.round(((odak * boy) / h) * duzeltme * 2) / 2; // 0,5 m'ye yuvarla
        }
      }
      return { sinif: s.class, isim: TR[s.class] || s.class, yon, saat, mesafe, yakin, skor: s.score, bbox: s.bbox };
    }

    function mesafeYazisi(n) {
      if (n.yakin) return 'çok yakın';
      if (n.mesafe === null) return 'mesafe bilinmiyor';
      if (n.mesafe > MAX_MESAFE) return MAX_MESAFE + '+ m';
      return '~' + String(n.mesafe).replace('.', ',') + ' m';
    }

    function siraAnahtari(n) {
      if (n.yakin) return 0;
      if (n.mesafe === null) return 999;
      return n.mesafe;
    }

    // ---------- ÇİZİM VE LİSTE ----------
    function isle(sonuclar) {
      const nesneler = sonuclar.filter(s => s.score >= 0.5).map(analizEt);
      nesneler.sort((a, b) => siraAnahtari(a) - siraAnahtari(b));
      sesliUyari(nesneler);

      ctx.clearRect(0, 0, kanvas.width, kanvas.height);

      // "Ön" bölgenin sınırlarını ince çizgilerle göster
      const yarim = Math.tan(ON_ESIK_ACI * Math.PI / 180) * odak;
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      for (const cx of [kanvas.width / 2 - yarim, kanvas.width / 2 + yarim]) {
        ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, kanvas.height); ctx.stroke();
      }
      ctx.setLineDash([]);

      ctx.font = 'bold 24px system-ui, sans-serif';
      ctx.textBaseline = 'top';
      for (const n of nesneler) {
        const [x, y, g, h] = n.bbox;
        const yazi = n.isim + ', ' + mesafeYazisi(n);
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#ffd400';
        ctx.strokeRect(x, y, g, h);
        const w = ctx.measureText(yazi).width + 10;
        const ly = Math.max(0, y - 30);
        ctx.fillStyle = '#ffd400';
        ctx.fillRect(x, ly, w, 30);
        ctx.fillStyle = '#000';
        ctx.fillText(yazi, x + 5, ly + 3);
      }

      if (!nesneler.length) {
        liste.textContent = 'Nesne görünmüyor.';
        return;
      }
      liste.textContent = nesneler.slice(0, 4).map(n =>
        n.isim + ': ' + mesafeYazisi(n) + ', ' + n.yon + ' (saat ' + n.saat + ')'
      ).join('\n');
    }
  </script>
</body>
</html>
